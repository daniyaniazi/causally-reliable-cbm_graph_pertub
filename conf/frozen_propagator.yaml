defaults:
  - dataset: celeba
  - causal_discovery: ges
  - llm: gpt
  - rag: Null
  - model: c2bm
  - engine: predictor
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    subdir: "${hydra.job.num}"

experiment:
  freeze_c2bm_encoder: true
  freeze_concept_encoders: true
  freeze_concept_scorers: true
  freeze_propagators: true
  skip_training: true
  encoder_checkpoint: null

completion:
  n_tries: 1
  cycles_allowed: True
  selection_bias: True
  external_answers: Null

trainer:
  max_epochs: 500
  monitor: "val_loss"
  patience: 30

seed: 1
notes: frozen_encoder_concept_modules_and_original_propagators_on_degree_preserving_topology
