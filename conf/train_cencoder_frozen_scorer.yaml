defaults:
  - dataset: celeba
  - causal_discovery: ges
  - llm: gpt
  - rag: Null
  - model: c2bm
  - engine: predictor
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    subdir: "${hydra.job.num}"

experiment:
  freeze_c2bm_encoder: true
  freeze_concept_encoders: false
  freeze_concept_scorers: true
  # Start c_encoder modules with this run's seed, not original checkpoint weights.
  initialize_concept_encoders: false
  encoder_checkpoint: null

completion:
  n_tries: 1
  cycles_allowed: True
  selection_bias: True
  external_answers: Null

trainer:
  max_epochs: 500
  monitor: "val_loss"
  patience: 30

seed: 1
notes: trainable_concept_candidate_mlps_with_frozen_encoder_and_scorers
