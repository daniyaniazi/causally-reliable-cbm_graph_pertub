# Initialize all requested modules from an original C2BM checkpoint. The image
# encoder and c_scorers train; each node's candidate-representation MLP stays fixed.
defaults:
  - dataset: celeba
  - causal_discovery: ges
  - llm: gpt
  - rag: Null
  - model: c2bm
  - engine: predictor
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    subdir: "${hydra.job.num}"

experiment:
  freeze_c2bm_encoder: false
  # Trainable modules start from fresh initialization; only fixed c_encoders
  # are restored from the original checkpoint.
  initialize_c2bm_encoder: false
  freeze_concept_encoders: true
  freeze_concept_scorers: false
  initialize_concept_scorers: false
  encoder_checkpoint: null

completion:
  n_tries: 1
  cycles_allowed: True
  selection_bias: True
  external_answers: Null

trainer:
  max_epochs: 500
  monitor: "val_loss"
  patience: 30

seed: 1
notes: trainable_encoder_with_frozen_concept_candidate_mlps
