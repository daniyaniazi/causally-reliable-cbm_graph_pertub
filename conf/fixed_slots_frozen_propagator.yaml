defaults:
  - dataset: celeba
  - causal_discovery: ges
  - llm: gpt
  - rag: Null
  - model: c2bm
  - engine: predictor
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    subdir: "${hydra.job.num}"

experiment:
  # This must be a checkpoint trained with fixed_parent_slots=true and scope=all.
  encoder_checkpoint: null
  freeze_propagators: true
  freeze_c2bm_encoder: false
  freeze_concept_encoders: false
  freeze_concept_scorers: false
  skip_training: false

completion:
  n_tries: 1
  cycles_allowed: true
  selection_bias: true
  external_answers: null

trainer:
  max_epochs: 500
  monitor: val_loss
  patience: 30

seed: 1
notes: degree_preserving_fixed_parent_slots_frozen_propagator
