# Start from a matched CelebA run and freeze the image encoder plus each node's
# candidate-representation MLP. Keep c_scorers and graph propagators trainable.
defaults:
  - dataset: celeba
  - causal_discovery: ges
  - llm: gpt
  - rag: Null
  - model: c2bm
  - engine: predictor
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    subdir: "${hydra.job.num}"

experiment:
  freeze_c2bm_encoder: true
  freeze_concept_encoders: true
  freeze_concept_scorers: false
  # Trainable scorers start from their fresh model initialization.
  initialize_concept_scorers: false
  encoder_checkpoint: null

completion:
  n_tries: 1
  cycles_allowed: True
  selection_bias: True
  external_answers: Null

trainer:
  max_epochs: 500
  monitor: "val_loss"
  patience: 30

seed: 1
notes: frozen_encoder_and_concept_candidate_mlps
